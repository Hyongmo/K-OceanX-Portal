name: Collect and publish portal

on:
  workflow_dispatch:
    inputs:
      check_naver:
        description: Verify Naver search and official notice discovery without publishing
        type: boolean
        default: false
      check_apis:
        description: Verify official Bizinfo and K-Startup APIs without publishing
        type: boolean
        default: false
      publish:
        description: Publish to the configured GitHub Pages site
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: oceanx-portal
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest -q
      - name: Verify Naver search and official notices
        if: inputs.check_naver && !inputs.publish
        run: python collect.py --check-naver
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
      - name: Verify official support APIs
        if: inputs.check_apis && !inputs.publish
        run: python check_apis.py
        env:
          BIZINFO_API_KEY: ${{ secrets.BIZINFO_API_KEY }}
          BIZINFO_EVENT_API_KEY: ${{ secrets.BIZINFO_EVENT_API_KEY }}
          KSTARTUP_API_KEY: ${{ secrets.KSTARTUP_API_KEY }}
      - name: Install the Korean text reader for event posters
        if: "(!inputs.check_naver && !inputs.check_apis) || inputs.publish"
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-kor
      - name: Collect public portal information
        if: "(!inputs.check_naver && !inputs.check_apis) || inputs.publish"
        run: python collect.py
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          BIZINFO_API_KEY: ${{ secrets.BIZINFO_API_KEY }}
          BIZINFO_EVENT_API_KEY: ${{ secrets.BIZINFO_EVENT_API_KEY }}
          KSTARTUP_API_KEY: ${{ secrets.KSTARTUP_API_KEY }}
      - uses: actions/upload-pages-artifact@v4
        if: "(!inputs.check_naver && !inputs.check_apis) || inputs.publish"
        with:
          path: dist

  deploy:
    if: inputs.publish
    needs: collect
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
