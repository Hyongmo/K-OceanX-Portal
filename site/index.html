<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="해양수산 AI·데이터 기업을 위한 연구개발, 산업동향, 행사 및 기업지원 정보.">
  <title>K-OceanX 기업성장 정보포털</title>
  <link rel="stylesheet" href="./portal.css?v=11">
  <script defer src="./portal.js"></script>
</head>
<body>
  <header class="top">
    <div class="wrap top-inner">
      <a class="brand brand-oceanx" href="https://k-oceanx.or.kr/" aria-label="K-OceanX 홈페이지">
        <span class="brand-symbol"><img src="./logos/k-oceanx.svg" width="209" height="56" alt=""></span>
        <span>K-Ocean<span class="brand-accent">X</span></span>
      </a>
      <a class="brand brand-kmi" href="https://www.kmi.re.kr/web/main/main.do?rbsIdx=1">
        <img src="./logos/kmi.png" width="409" height="75" alt="KMI 한국해양수산개발원">
        <svg class="brand-kmi-center" viewBox="0 0 286 29" role="img" aria-label="AI·데이터산업혁신센터">
          <text x="0" y="24" textLength="286" lengthAdjust="spacing" aria-hidden="true">AI·데이터산업혁신센터</text>
        </svg>
      </a>
    </div>
  </header>
  <main>
    <section class="intro">
      <div class="wrap">
        <p class="eyebrow">해양수산 AI · 데이터</p>
        <h1>기업성장 정보포털</h1>
        <p>연구개발 공고부터 산업동향, 국내외 행사와 기업지원 정보를 찾아보세요.</p>
        <label for="query" class="sr-only">통합검색</label>
        <input id="query" type="search" placeholder="예: 스마트항만, 자율운항, 창업" autocomplete="off">
        <p class="naver-search">
          <a id="naver-news" href="https://search.naver.com/search.naver?where=news&amp;query=%ED%95%B4%EC%96%91%EC%88%98%EC%82%B0+AI">네이버 뉴스에서 검색</a>
          <a id="naver-web" href="https://search.naver.com/search.naver?where=web&amp;query=%ED%95%B4%EC%96%91%EC%88%98%EC%82%B0+AI">네이버 웹문서에서 검색</a>
        </p>
      </div>
    </section>
    <section class="wrap catalog" aria-labelledby="results-title">
      <section id="briefing" aria-labelledby="briefing-title" hidden>
        <div class="briefing-header">
          <h2 id="briefing-title">기업지원 브리핑</h2>
          <p id="briefing-date"></p>
        </div>
        <div class="briefing-columns">
          <section id="briefing-deadlines" aria-labelledby="briefing-deadlines-title" hidden>
            <h3 id="briefing-deadlines-title">마감 임박</h3>
            <ul id="briefing-deadline-list"></ul>
          </section>
          <section id="briefing-latest" aria-labelledby="briefing-latest-title" hidden>
            <h3 id="briefing-latest-title">새로 올라온 소식</h3>
            <ul id="briefing-latest-list"></ul>
          </section>
        </div>
      </section>
      <nav id="categories" aria-label="정보 영역"></nav>
      <fieldset id="support-filters" class="support-filters" hidden>
        <legend>기업지원사업 찾기</legend>
        <div class="filters">
          <label>기업 단계<select id="support-stages"><option value="">전체</option></select></label>
          <label>지원 내용<select id="support-types"><option value="">전체</option></select></label>
          <label>지원 방식<select id="support-methods"><option value="">전체</option></select></label>
          <label>사업 지역<select id="support-regions"><option value="">전체</option></select></label>
        </div>
      </fieldset>
      <section id="rnd-featured" aria-labelledby="rnd-featured-title" hidden>
        <h2 id="rnd-featured-title">지금 검토할 R&D 기회</h2>
        <ul id="rnd-picks"></ul>
      </section>
      <div class="toolbar">
        <div><h2 id="results-title">통합 결과</h2><p id="summary" role="status">정보를 불러오는 중입니다.</p></div>
        <div class="filters">
          <label id="planning-stage-filter" hidden>참여 유형<select id="planning-stage"><option value="">전체</option></select></label>
          <label>정보원<select id="source"><option value="">전체</option></select></label>
          <label>정렬<select id="sort"><option value="latest">최신순</option><option value="deadline">마감일순</option></select></label>
        </div>
      </div>
      <ul id="results"></ul>
      <button type="button" id="more" hidden>더 보기</button>
    </section>
  </main>
  <footer class="wrap"><span>K-OceanX</span><span id="updated"></span></footer>
</body>
</html>
